<title>Palmera Heat — an original open-world crime game</title>
<style>

  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

</style>
</head>

<canvas id="game" aria-label="Palmera Heat: explore the city of Palmera on foot and by car, take jobs, outrun the law"></canvas>
<p id="status" role="status" aria-live="polite">Palmera Heat. An open-world crime game in the coastal city of Palmera.</p>
